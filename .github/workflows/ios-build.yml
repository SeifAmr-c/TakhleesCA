name: iOS Build & Submit to TestFlight

on:
  push:
    branches:
      - seif
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: EAS Build & Submit (iOS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Write ASC API Key to disk
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s' "$ASC_API_KEY_P8" > AuthKey_2TJ98T7SXQ.p8

      - name: Build and submit to TestFlight
        env:
          # TODO: replace with your actual LAN IPv4 before pushing
          EXPO_PUBLIC_API_URL: http://192.168.1.8:3000
        run: eas build --platform ios --profile production --auto-submit --non-interactive
